# .github/workflows/deploy.yml
#
# Runs on every push to main. Builds the site with build.py and
# publishes ./dist to GitHub Pages. First run takes ~1 minute;
# after that, edits usually go live in ~30 seconds.
#
# The access key comes from the HYMNAL_KEY repository secret
# (Settings → Secrets and variables → Actions). It's never stored in
# the repo and never printed in the build log.
#
# You should never need to touch this file. If you do, GitHub will
# not let you break anything permanent — old deploys stay live until
# a new one succeeds.

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you re-run manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site
        run: python build.py
        env:
          HYMNAL_KEY: ${{ secrets.HYMNAL_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
